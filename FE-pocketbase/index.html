      /* Defensive shim for environments (such as sandboxed iframes) where window.fetch
         or Window.prototype.fetch is defined with only a getter and no setter. */

        try {
          var targets = [
            typeof window !== 'undefined' ? window : null,
            typeof globalThis !== 'undefined' ? globalThis : null,
            typeof Window !== 'undefined' && Window.prototype ? Window.prototype : null
          ];
          for (var i = 0; i < targets.length; i++) {
            var target = targets[i];
            if (!target) continue;
            try {
              var currentFetch = target.fetch || (typeof window !== 'undefined' ? window.fetch : null);
              var _fetch = typeof currentFetch === 'function' ? currentFetch.bind(target) : currentFetch;
              var desc = Object.getOwnPropertyDescriptor(target, 'fetch');
              if (!desc || (desc.get && !desc.set) || desc.writable === false) {
                Object.defineProperty(target, 'fetch', {
                  configurable: true,
                  enumerable: true,
                  get: function() { return _fetch; },
                  set: function(val) { _fetch = val; }
